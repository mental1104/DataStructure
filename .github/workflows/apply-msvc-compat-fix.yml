name: Apply MSVC compatibility fix

on:
  pull_request:
    types: [synchronize]
    branches: [agent/consolidate-tutorial-implementations]

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.head_ref == 'agent/refactor-remaining-families'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Apply verified compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .msvc-compat-fix | xz -d > /tmp/msvc-compat.patch
          git apply --index /tmp/msvc-compat.patch
          rm .msvc-compat-fix
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: 修复 MSVC 泛型兼容性"
          git push origin HEAD:agent/refactor-remaining-families
