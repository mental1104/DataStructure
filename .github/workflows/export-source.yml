name: Export source snapshot

on:
  pull_request:
    types: [ready_for_review, synchronize, reopened]
    branches: [agent/consolidate-tutorial-implementations]

permissions:
  contents: read

jobs:
  export-source:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Pack source tree
        run: |
          tar --exclude=.git --exclude='build*' -czf /tmp/datastructure-source.tar.gz .

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: datastructure-source-${{ github.event.pull_request.head.sha }}
          path: /tmp/datastructure-source.tar.gz
          retention-days: 1
