name: Apply remaining refactor

on:
  pull_request:
    types: [ready_for_review, synchronize]
    branches: [agent/consolidate-tutorial-implementations]

permissions:
  contents: write

jobs:
  apply-refactor:
    if: github.head_ref == 'agent/refactor-remaining-families'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Apply verified patch
        shell: bash
        run: |
          set -euo pipefail
          cat .refactor-patch/part-* | base64 -d | xz -d > /tmp/remaining-refactor.patch
          git apply --index /tmp/remaining-refactor.patch
          rm -rf .refactor-patch
          rm -f .github/workflows/apply-remaining-refactor.yml
          rm -f .github/workflows/export-source.yml .refactor-bootstrap
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: 完成剩余数据结构与算法工业化"
          git push origin HEAD:agent/refactor-remaining-families
